<!DOCTYPE html>
<html>
<head>
    <title>VirtualBox Browser Edition</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: monospace; }
        #vbox-console { width: 100vw; height: 100vh; display: block; }
        #vbox-controls { position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; z-index: 100; }
        #vbox-controls button { padding: 8px 16px; background: #333; color: #fff; border: 1px solid #555; cursor: pointer; border-radius: 4px; font-family: monospace; }
        #vbox-controls button:hover { background: #555; }
        #vbox-controls button:active { background: #777; }
        #vbox-settings { position: fixed; top: 10px; right: 10px; background: rgba(30,30,30,0.95); color: #fff; padding: 16px; border-radius: 8px; display: none; z-index: 100; min-width: 300px; max-height: 80vh; overflow-y: auto; }
        #vbox-settings.show { display: block; }
        #vbox-settings h3 { margin-bottom: 12px; color: #4fc3f7; }
        #vbox-settings label { display: block; margin: 4px 0; font-size: 12px; color: #aaa; }
        #vbox-settings input, #vbox-settings select { width: 100%; padding: 6px; margin: 4px 0 8px; background: #222; color: #fff; border: 1px solid #444; border-radius: 4px; }
        #vbox-status { position: fixed; top: 10px; left: 10px; color: #4fc3f7; font-size: 12px; z-index: 100; }
        #vbox-toolbar { position: fixed; top: 0; left: 0; right: 0; height: 40px; background: #1a1a2e; display: flex; align-items: center; padding: 0 16px; gap: 12px; z-index: 200; }
        #vbox-toolbar button { padding: 6px 12px; background: #16213e; color: #e0e0e0; border: 1px solid #0f3460; cursor: pointer; border-radius: 3px; font-size: 12px; }
        #vbox-toolbar button:hover { background: #0f3460; }
        #vbox-toolbar span { color: #e0e0e0; font-size: 13px; }
        .vbox-panel { position: fixed; bottom: 50px; left: 10px; background: rgba(20,20,30,0.9); color: #aaa; padding: 8px; border-radius: 4px; font-size: 11px; z-index: 100; max-height: 200px; overflow-y: auto; }
    </style>
</head>
<body>
    <div id="vbox-toolbar">
        <button id="start">Start</button>
        <button id="pause">Pause</button>
        <button id="stop">Stop</button>
        <button id="fullscreen">Fullscreen</button>
        <button id="settings">Settings</button>
        <span id="vbox-status">VirtualBox Browser Edition</span>
    </div>
    <canvas id="vbox-console" width="1280" height="720"></canvas>
    <div id="vbox-settings" style="display:none">
        <h3>VM Settings</h3>
        <label>Name:</label>
        <input type="text" id="setting-name" placeholder="VM Name">
        <label>Memory (MB):</label>
        <input type="number" id="setting-memory" value="1024">
        <label>CPUs:</label>
        <input type="number" id="setting-cpus" value="1">
        <label>Storage:</label>
        <input type="text" id="setting-storage" placeholder="Disk image path">
    </div>
    <div class="vbox-panel" id="vbox-console-output"></div>
    <script type="module">
        import init from './pkg/vbox_web.js';
        await init();
        window.vbox = new VBoxAPI();
    </script>
</body>
</html>
