[package]
name = "vbox-main"
version = "0.1.0"
edition = "2021"

[lib]
name = "vbox_main"
path = "src/lib.rs"

[dependencies]
vbox-core = { path = "../vbox-core" }
vbox-runtime = { path = "../vbox-runtime" }
vbox-storage = { path = "../vbox-storage" }
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }

[features]
default = []
