[package]
name = "vbox-runtime"
version = "0.1.0"
edition = "2021"

[dependencies]
vbox-core = { path = "../vbox-core" }
parking_lot = "0.12"
smallvec = "1"
log = "0.4"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cfg-if = "1"
sha2 = "0.10"
getrandom = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_log = "0.2"
wasm-bindgen = "0.2"

