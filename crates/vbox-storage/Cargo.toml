[package]
name = "vbox-storage"
version = "0.1.0"
edition = "2021"

[dependencies]
vbox-core = { path = "../vbox-core" }
vbox-runtime = { path = "../vbox-runtime" }
vbox-devices = { path = "../vbox-devices" }
parking_lot = "0.12"
smallvec = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
cfg-if = "1"
sha2 = "0.10"
flate2 = "1"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
bincode = "1.3"

[lib]
name = "vbox_storage"
path = "src/lib.rs"
