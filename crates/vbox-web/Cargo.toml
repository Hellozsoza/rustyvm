[package]
name = "vbox-web"
version = "0.1.0"
edition = "2021"

[lib]
name = "vbox_web"
path = "src/lib.rs"

[dependencies]
vbox-core = { path = "../vbox-core" }
vbox-runtime = { path = "../vbox-runtime" }
vbox-vmm = { path = "../vbox-vmm" }
vbox-devices = { path = "../vbox-devices" }
vbox-storage = { path = "../vbox-storage" }
vbox-main = { path = "../vbox-main" }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", default-features = false, features = ["Window", "Document", "HtmlCanvasElement", "CanvasRenderingContext2d", "AudioContext", "AudioBufferSourceNode", "MediaStream", "Navigator", "File", "FileList", "Clipboard", "EventTarget", "KeyboardEvent", "MouseEvent", "TouchEvent", "DragEvent", "InputEvent", "WebSocket", "Response", "Request", "Headers", "Storage", "Performance", "console", "Element", "Node", "HtmlElement", "CustomEvent", "Event", "UiEvent", "CanvasGradient", "CanvasPattern", "ImageData"] }
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
parking_lot = "0.12"
log = "0.4"
console_log = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1"
cfg-if = "1"

[features]
default = []
