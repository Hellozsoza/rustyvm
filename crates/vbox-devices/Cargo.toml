[package]
name = "vbox-devices"
version = "0.1.0"
edition = "2021"

[dependencies]
vbox-core = { path = "../vbox-core" }
vbox-runtime = { path = "../vbox-runtime" }
vbox-vmm = { path = "../vbox-vmm" }
parking_lot = "0.12"
smallvec = "1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
cfg-if = "1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = "0.20"
web-sys = { version = "0.3", features = [
  "HtmlCanvasElement", "CanvasRenderingContext2d", "WebGlRenderingContext", "WebGl2RenderingContext"
] }

[lib]
name = "vbox_devices"
path = "src/lib.rs"
